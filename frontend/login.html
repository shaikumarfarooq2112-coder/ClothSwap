<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ClothSwap</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">ClothSwap</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </div>

</nav>


<div class="form-container">

    <h1>Login</h1>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button class="btn" type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

</div>

<script src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Swap - ClothSwap</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">ClothSwap</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="listings.html">Browse Clothes</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="swap-requests.html">Swaps</a>
    </div>
</nav>

<section class="features">

    <h1>Request a Swap</h1>

    <div id="itemDetails"></div>

    <form id="swapForm">

        <label for="offeredItem">Select Your Clothing Item</label>

        <select id="offeredItem" required>
            <option value="">Loading your clothes...</option>
        </select>

        <br><br>

        <label for="message">Message</label>

        <textarea
            id="message"
            rows="5"
            placeholder="Write a message to the owner..."
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Send Swap Request
        </button>

    </form>

    <p id="swapMessage"></p>

</section>

<script src="js/swap-request.js"></script>

</body>
</html>
